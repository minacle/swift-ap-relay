services:
  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey-data:/data
    command: ["valkey-server", "--appendonly", "yes"]

  app:
    image: ghcr.io/sinoru/swift-ap-relay:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://valkey:6379
    depends_on:
      - valkey
    command: ["serve", "--hostname", "0.0.0.0", "--port", "8080"]

volumes:
  valkey-data:
